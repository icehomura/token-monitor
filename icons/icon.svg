<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b2e"/>
      <stop offset="1" stop-color="#1d2a4a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#35d0a5"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#35d0a5"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="none"
        stroke="#31406b" stroke-width="10"/>

  <!-- 网格背景线 -->
  <g stroke="#263049" stroke-width="6" opacity="0.6">
    <line x1="152" y1="712" x2="872" y2="712"/>
    <line x1="152" y1="560" x2="872" y2="560"/>
    <line x1="152" y1="408" x2="872" y2="408"/>
  </g>

  <!-- RPM 柱状图 -->
  <g fill="url(#bar)">
    <rect x="192" y="560" width="88" height="232" rx="24"/>
    <rect x="320" y="448" width="88" height="344" rx="24"/>
    <rect x="448" y="600" width="88" height="192" rx="24"/>
    <rect x="576" y="352" width="88" height="440" rx="24"/>
    <rect x="704" y="240" width="88" height="552" rx="24"/>
  </g>

  <!-- TPM 折线 -->
  <polyline points="236,536 364,420 492,488 620,300 748,180"
            fill="none" stroke="url(#line)" stroke-width="34"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#eaf2ff">
    <circle cx="236" cy="536" r="30"/>
    <circle cx="364" cy="420" r="30"/>
    <circle cx="492" cy="488" r="30"/>
    <circle cx="620" cy="300" r="30"/>
    <circle cx="748" cy="180" r="34"/>
  </g>

  <!-- 右上角 token 闪电 -->
  <path d="M806 96 L668 328 L776 328 L716 512 L900 260 L788 260 L862 96 Z"
        fill="#ffd166" stroke="#141b2e" stroke-width="14" stroke-linejoin="round"/>
</svg>
