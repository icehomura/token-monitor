[package]
name = "token-monitor"
version = "0.1.11"
description = "Trae API proxy with RPM/TPM monitoring"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tower-http = { version = "0.6", features = ["cors"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
libloading = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
